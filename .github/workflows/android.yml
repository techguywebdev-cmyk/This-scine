name: Android app

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version shown in the Play Store (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key yet — building an UNSIGNED test build. Add ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets to get Play-ready files."
            exit 0
          fi
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          # Tolerate copy/paste damage (line breaks, spaces, surrounding text): keep the longest base64 run
          printf '%s' "$KEYSTORE_B64" | python3 -c "import sys,re,base64; s=re.sub(r'\s+','',sys.stdin.read()); runs=re.findall(r'[A-Za-z0-9+/]{200,}={0,2}',s); sys.exit('no-key') if not runs else None; k=max(runs,key=len); k=k[:len(k)-len(k)%4] if len(k)%4==1 else k+'='*(-len(k)%4); b=base64.b64decode(k); b=b[:4+(b[2]<<8|b[3])] if b[:2]==bytes([48,130]) else b; open(sys.argv[1],'wb').write(b)" "$RUNNER_TEMP/upload.jks" \
            || { echo "::error title=Signing key::ANDROID_KEYSTORE_B64 doesn't contain the key. Paste the whole long line from the key file (it starts with MII…)."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error title=Signing key::The key loaded, but ANDROID_KEYSTORE_PASSWORD doesn't open it. Re-paste the password exactly (no spaces or line breaks)."; exit 1; }
          echo "Signing key OK"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK + App Bundle
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: upload
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ github.event.inputs.versionName || '1.0.0' }} 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Surface the real error as an annotation (readable without the full log)
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|> |e: |FAILED|AAPT|cannot find symbol|not found" gradle.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit $code
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/thiscene.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/thiscene-UNSIGNED.apk
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab out/thiscene.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: thiscene-android-${{ github.run_number }}
          path: out/
          retention-days: 30
