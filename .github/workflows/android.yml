name: Android app

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version shown in the Play Store (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key yet — building an UNSIGNED test build. Add ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets to get Play-ready files."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK + App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ github.event.inputs.versionName || '1.0.0' }} 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Surface the real error as an annotation (readable without the full log)
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|> |e: |FAILED|AAPT|cannot find symbol|not found" gradle.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit $code
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/thiscene.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/thiscene-UNSIGNED.apk
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab out/thiscene.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: thiscene-android-${{ github.run_number }}
          path: out/
          retention-days: 30
