name: Android app

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version shown in the Play Store (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Clerk publishable keys are public by design (they ship inside every app/website)
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_YXdhaXRlZC1wb3Jwb2lzZS0yMi5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_API_URL: https://this-scine.vercel.app
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: ${{ github.event.inputs.versionName || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key — this build is signed with a throwaway debug key (fine for testing, not for Play)."
            exit 0
          fi
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | python3 -c "import sys,re,base64; s=re.sub(r'\s+','',sys.stdin.read()); runs=re.findall(r'[A-Za-z0-9+/]{200,}={0,2}',s); sys.exit('no-key') if not runs else None; k=max(runs,key=len); k=k[:len(k)-len(k)%4] if len(k)%4==1 else k+'='*(-len(k)%4); b=base64.b64decode(k); b=b[:4+(b[2]<<8|b[3])] if b[:2]==bytes([48,130]) else b; open(sys.argv[1],'wb').write(b)" "$RUNNER_TEMP/upload.jks" \
            || { echo "::error title=Signing key::ANDROID_KEYSTORE_B64 doesn't contain the key. Paste the whole long line from the key file (it starts with MII…)."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error title=Signing key::The key loaded, but ANDROID_KEYSTORE_PASSWORD doesn't open it."; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Signing key OK"

      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate native project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK + App Bundle
        working-directory: mobile/android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|e: |FAILED|AAPT|cannot find symbol|not found|Unresolved" gradle.log | grep -v "^> Task" | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit $code
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/thiscene.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/thiscene.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: thiscene-android-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Publish test APK (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android test build (latest)" --notes "Newest test APK from the Android app workflow." --prerelease
          gh release upload android-latest out/thiscene.apk --clobber
          gh release edit android-latest --notes "Build #${{ github.run_number }} · $(date -u +%Y-%m-%dT%H:%MZ)"
