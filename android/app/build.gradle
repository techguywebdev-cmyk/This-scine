plugins {
    id 'com.android.application'
}

def twaHost = project.findProperty('twaHost') ?: 'thiscene.com'
def launchUrl = "https://${twaHost}/?source=android"

android {
    namespace 'com.thiscene.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.thiscene.app'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(project.findProperty('versionCode') ?: '1')
        versionName project.findProperty('versionName') ?: '1.0.0'

        resValue 'string', 'hostName', twaHost
        resValue 'string', 'launchUrl', launchUrl
        resValue 'string', 'providerAuthority', 'com.thiscene.app.fileprovider'
        resValue 'string', 'assetStatements', """[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://${twaHost}"} }]"""
        manifestPlaceholders = [hostName: twaHost]
    }

    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { resValues true }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
